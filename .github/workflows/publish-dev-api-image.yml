name: Publish Development API Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-image:
    name: Publish API image
    runs-on: ubuntu-latest
    environment: development
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::526811500752:role/gym-management-dev-github-deploy-role
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gym-management-dev-api-ecr
        run: docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./backend
      - name: Push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gym-management-dev-api-ecr
        run: docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Show published image tag
        run: |
          echo "Published image tag: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
