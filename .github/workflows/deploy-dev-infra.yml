name: Deploy Development Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 実行する操作
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy
      stack_name:
        description: デプロイするCDKスタック
        required: false
        type: choice
        options:
          - DevCiCdIdentityStack
          - DevContainerRegistryStack
          - DevAlertNotificationStack
          - DevRegionalCertificateStack
          - DevEdgeCertificateStack
          - DevWafStack
          - DevNetworkStack
          - DevApplicationStack
          - DevApplicationMonitoringStack
          - DevDatabaseStack
          - DevDatabaseOperationsStack
          - DevAuthenticationStack
          - DevCloudFrontStack
          - DevEdgeMonitoringStack
          - DevAuditStack
      image_tag:
        description: DB初期化タスクで使うECRイメージのタグ
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  select-stack:
    name: Select deployment stack
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::526811500752:role/gym-management-dev-github-deploy-role
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Validate stack selection
        if: inputs.operation == 'deploy'
        run: |
          test -n "${{ inputs.stack_name }}"
      - name: Validate image tag
        if: inputs.operation == 'deploy' && (inputs.stack_name == 'DevDatabaseOperationsStack' || inputs.stack_name == 'DevApplicationStack')
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: test -n "$IMAGE_TAG"
      - run: npm ci
        if: inputs.operation == 'deploy'
      - name: Deploy selected stack
        if: inputs.operation == 'deploy' && inputs.stack_name != 'DevDatabaseOperationsStack' && inputs.stack_name != 'DevApplicationStack'
        run: npx cdk deploy ${{ inputs.stack_name }} --exclusively --require-approval never
      - name: Deploy database operations stack
        if: inputs.operation == 'deploy' && inputs.stack_name == 'DevDatabaseOperationsStack'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: npx cdk deploy DevDatabaseOperationsStack --parameters "DevDatabaseOperationsStack:DatabaseBootstrapImageTag=$IMAGE_TAG" --exclusively --require-approval never
      - name: Deploy application stack
        if: inputs.operation == 'deploy' && inputs.stack_name == 'DevApplicationStack'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: npx cdk deploy DevApplicationStack --parameters "DevApplicationStack:ApiImageTag=$IMAGE_TAG" --exclusively --require-approval never
