name: Deploy Development Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 実行する操作
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy
      stack_name:
        description: デプロイするCDKスタック
        required: false
        type: choice
        options:
          - DevNetworkStack
          - DevApplicationStack
          - DevDatabaseStack
          - DevAuthenticationStack
          - DevCloudFrontStack

permissions:
  contents: read
  id-token: write

jobs:
  select-stack:
    name: Select deployment stack
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::526811500752:role/gym-management-dev-github-deploy-role
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Validate stack selection
        if: inputs.operation == 'deploy'
        run: |
          test -n "${{ inputs.stack_name }}"
      - run: npm ci
        if: inputs.operation == 'deploy'
      - run: npx cdk deploy ${{ inputs.stack_name }} --exclusively --require-approval never
        if: inputs.operation == 'deploy'
