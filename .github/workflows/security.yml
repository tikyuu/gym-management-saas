name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan tracked history without exposing secret values
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --ignore-gitleaks-allow --redact=100 --no-banner'
  npm:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ["infra/cdk"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Show all findings; block HIGH and CRITICAL
        run: npm audit --audit-level=high --ignore-scripts
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: [{"directory": "backend", "kind": "uv", "python": "3.14"}]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.18'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Resolve pinned requirements without installing project code
        env:
          AUDIT_KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUDIT_KIND" = uv ]; then
            uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt > "$RUNNER_TEMP/audit-requirements.txt"
          else
            args=()
            for file in requirements*.txt; do args+=("$file"); done
            uv pip compile --upgrade --no-build "${args[@]}" --output-file "$RUNNER_TEMP/audit-requirements.txt"
          fi
      - name: Audit every resolved dependency
        run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps --requirement "$RUNNER_TEMP/audit-requirements.txt"
  iac:
    name: IaC findings (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz' | sha256sum --check
          tar -xzf trivy.tar.gz trivy
      - name: Report HIGH and CRITICAL configuration findings
        id: scan
        continue-on-error: true
        run: '"$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 .'
      - name: Explain IaC result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" = success ]; then
            echo '## IaC: scanned files contain no HIGH/CRITICAL findings' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCAN_OUTCOME" = failure ]; then
            echo '::warning::IaC findings or a scanner error need review. See the scan step.'
            echo '## IaC: review required (advisory, not a merge gate)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'IaC scan did not complete.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
