name: Destroy Development Infrastructure

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: 削除するCDKスタック
        required: true
        type: choice
        options:
          - DevContainerRegistryStack
          - DevNetworkStack
          - DevApplicationStack
          - DevDatabaseStack
          - DevAuthenticationStack
          - DevCloudFrontStack
      confirmation:
        description: 削除する場合はDELETEと入力
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Destroy selected stack
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v7
      - name: Validate deletion confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DELETE"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::526811500752:role/gym-management-dev-github-deploy-role
      - run: npm ci
      - name: Destroy selected stack
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: npx cdk destroy "$STACK_NAME" --exclusively --force
