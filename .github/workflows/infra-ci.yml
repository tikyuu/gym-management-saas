name: Infrastructure CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cdk synth --quiet

  build-api-image:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag gym-management-api:ci ./backend
